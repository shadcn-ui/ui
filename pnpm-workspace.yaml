packages:
  - "apps/*"
  - "packages/*"
  - "!**/test/**"
  - "!**/fixtures/**"
  - "!**/temp/**"
  - "!packages/tests/temp/**"

minimumReleaseAge: 2880
# TODO: remove once @tanstack/react-table@9.0.0 (published 2026-08-04) is older
# than the 48h minimumReleaseAge window.
minimumReleaseAgeExclude:
  - "@tanstack/react-table"
  - "@tanstack/table-core"
  - "@tanstack/react-store"
  - "@tanstack/store"
