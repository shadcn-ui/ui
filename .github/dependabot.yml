version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      deps:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]
        exclude-patterns:
          ["ai", "@ai-sdk/*", "@tanstack/*", "@base-ui/*", "fumadocs*"]
      framework-deps:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]
        patterns: ["ai", "@ai-sdk/*", "@tanstack/*", "@base-ui/*", "fumadocs*"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/templates/astro-app"
    schedule:
      interval: "weekly"
    groups:
      deps:
        applies-to: "version-updates"
